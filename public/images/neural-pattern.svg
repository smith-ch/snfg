<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="neural-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="currentColor" opacity="0.5"/>
      <line x1="15" y1="15" x2="45" y2="15" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
      <line x1="15" y1="15" x2="15" y2="45" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
      <line x1="15" y1="15" x2="45" y2="45" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
      <line x1="15" y1="15" x2="-15" y2="45" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#neural-grid)"/>
</svg>
