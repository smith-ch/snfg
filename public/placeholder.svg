<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a52;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2537;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c5a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a3a52" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Glow effect behind shield -->
  <ellipse cx="400" cy="280" rx="180" ry="160" fill="url(#glow)"/>
  
  <!-- Main Shield -->
  <g transform="translate(400,280)" filter="url(#shadow)">
    <!-- Shield outline -->
    <path d="M 0,-120 L 80,-90 L 80,40 Q 80,80 0,140 Q -80,80 -80,40 L -80,-90 Z" 
          fill="url(#shieldGrad)" 
          stroke="#ff6b35" 
          stroke-width="3"/>
    
    <!-- Inner shield detail -->
    <path d="M 0,-110 L 70,-85 L 70,35 Q 70,70 0,125 Q -70,70 -70,35 L -70,-85 Z" 
          fill="none" 
          stroke="#1a3a52" 
          stroke-width="2" 
          opacity="0.3"/>
    
    <!-- Check mark -->
    <g transform="translate(0,10)">
      <circle cx="0" cy="0" r="45" fill="url(#checkGrad)"/>
      <path d="M -20,0 L -8,15 L 25,-20" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="8" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
    
    <!-- Decorative stars -->
    <g opacity="0.8">
      <polygon points="0,-95 3,-88 10,-88 5,-83 7,-76 0,-81 -7,-76 -5,-83 -10,-88 -3,-88" 
               fill="#ffd700"/>
      <polygon points="-60,-70 -58,-65 -53,-65 -57,-61 -55,-56 -60,-60 -65,-56 -63,-61 -67,-65 -62,-65" 
               fill="#ffd700" opacity="0.7"/>
      <polygon points="60,-70 62,-65 67,-65 63,-61 65,-56 60,-60 55,-56 57,-61 53,-65 58,-65" 
               fill="#ffd700" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Quality ribbons -->
  <g transform="translate(280,240)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#1a3a52" opacity="0.9"/>
    <text x="120" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" 
          fill="#ffffff" text-anchor="middle">CALIDAD GARANTIZADA</text>
  </g>
  
  <g transform="translate(280,310)">
    <rect x="0" y="0" width="240" height="45" rx="22" fill="#ff6b35" opacity="0.9"/>
    <text x="120" y="29" font-family="Arial, sans-serif" font-size="18" font-weight="bold" 
          fill="#ffffff" text-anchor="middle">CERTIFICADO ISO</text>
  </g>
  
  <!-- Bottom text -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
        fill="#1a3a52" text-anchor="middle">Comprometidos con la Excelencia</text>
  <text x="400" y="515" font-family="Arial, sans-serif" font-size="18" 
        fill="#6b7280" text-anchor="middle">Tu confianza es nuestra prioridad</text>
  
  <!-- Decorative corner elements -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="30" fill="#1a3a52"/>
    <circle cx="750" cy="50" r="30" fill="#ff6b35"/>
    <circle cx="50" cy="550" r="30" fill="#ff6b35"/>
    <circle cx="750" cy="550" r="30" fill="#1a3a52"/>
  </g>
</svg>
